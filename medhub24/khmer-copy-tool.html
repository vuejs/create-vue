<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedHub24 Khmer Copy Tool</title>
    <meta name="description" content="Internal Khmer copy editor for MedHub24 locale text.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="locales/en/common.js"></script>
    <script src="locales/km/common.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #16324f;
            --muted: #5f6f82;
            --line: #d7e3ee;
            --soft: #f4f8fb;
            --mint: #32b8aa;
            --coral: #ef6659;
            --gold: #b9832c;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #edf5f7;
            color: var(--ink);
            font-family: Inter, "Noto Sans Khmer", system-ui, sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .tool-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .tool-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(22, 50, 79, 0.12);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .brand-mark {
            width: 2.4rem;
            height: 2.4rem;
            display: grid;
            place-items: center;
            border-radius: 0.5rem;
            color: var(--white);
            font-weight: 800;
            background: linear-gradient(135deg, var(--ink), var(--mint));
            flex: 0 0 auto;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text strong {
            display: block;
            font-size: 1rem;
            line-height: 1.15;
        }

        .brand-text span {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions,
        .editor-actions,
        .filters,
        .bulk-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 2.35rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            border-radius: 0.45rem;
            padding: 0.56rem 0.8rem;
            color: var(--ink);
            background: #e8f1f5;
            border: 1px solid rgba(22, 50, 79, 0.12);
            font-weight: 700;
            font-size: 0.82rem;
            line-height: 1;
        }

        .btn svg {
            width: 1rem;
            height: 1rem;
            flex: 0 0 auto;
        }

        .btn.primary {
            color: var(--white);
            background: var(--ink);
            border-color: var(--ink);
        }

        .btn.mint {
            color: #062b28;
            background: #a8eee6;
            border-color: rgba(50, 184, 170, 0.45);
        }

        .btn.coral {
            color: #501711;
            background: #ffd8d2;
            border-color: rgba(239, 102, 89, 0.35);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.48;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(18rem, 23rem) minmax(0, 1fr) minmax(17rem, 21rem);
            gap: 0;
            min-height: 0;
        }

        .sidebar,
        .review {
            background: rgba(255, 255, 255, 0.76);
            border-right: 1px solid rgba(22, 50, 79, 0.12);
            min-height: 0;
        }

        .review {
            border-right: 0;
            border-left: 1px solid rgba(22, 50, 79, 0.12);
        }

        .panel-inner {
            padding: 1rem;
        }

        .search {
            width: 100%;
            height: 2.7rem;
            border: 1px solid var(--line);
            border-radius: 0.45rem;
            padding: 0 0.8rem;
            color: var(--ink);
            background: var(--white);
            outline: none;
        }

        .search:focus,
        textarea:focus,
        .bulk-json:focus {
            border-color: rgba(50, 184, 170, 0.75);
            box-shadow: 0 0 0 3px rgba(50, 184, 170, 0.16);
        }

        .filters {
            margin-top: 0.75rem;
        }

        .page-tabs {
            display: flex;
            gap: 0.45rem;
            padding: 0.75rem 1.1rem;
            overflow-x: auto;
            border-bottom: 1px solid rgba(22, 50, 79, 0.1);
            background: #f8fbfc;
        }

        .chip {
            border-radius: 999px;
            padding: 0.46rem 0.7rem;
            background: #eef4f7;
            color: var(--muted);
            border: 1px solid transparent;
            font-weight: 700;
            font-size: 0.76rem;
        }

        .chip.active {
            color: var(--ink);
            border-color: rgba(50, 184, 170, 0.45);
            background: #dff8f5;
        }

        .entry-list {
            height: calc(100vh - 12.8rem);
            overflow: auto;
            padding: 0 0.75rem 1rem;
        }

        .entry {
            width: 100%;
            text-align: left;
            display: grid;
            gap: 0.35rem;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 0.45rem;
            color: var(--ink);
            background: transparent;
            border: 1px solid transparent;
        }

        .entry:hover,
        .entry.active {
            background: var(--white);
            border-color: rgba(22, 50, 79, 0.12);
        }

        .entry.active {
            box-shadow: 0 10px 24px rgba(22, 50, 79, 0.08);
        }

        .entry-key {
            font-weight: 800;
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }

        .entry-value {
            color: var(--muted);
            font-family: "Noto Sans Khmer", Inter, sans-serif;
            font-size: 0.86rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .entry-meta {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 1.35rem;
            border-radius: 999px;
            padding: 0.15rem 0.48rem;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--muted);
            background: #edf3f6;
        }

        .badge.warn {
            color: #6b3f00;
            background: #fff0ca;
        }

        .badge.edit {
            color: #0b5b55;
            background: #d7fbf6;
        }

        .badge.error {
            color: #7d2018;
            background: #ffe0db;
        }

        .editor {
            min-width: 0;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            background: #f9fcfd;
        }

        .editor-head {
            padding: 1rem 1.1rem;
            border-bottom: 1px solid rgba(22, 50, 79, 0.1);
            background: #ffffff;
        }

        .keyline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .keyline h1 {
            margin: 0;
            font-size: 1rem;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .status {
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .page-copy-list {
            display: grid;
            gap: 1rem;
            padding: 1rem 1.1rem;
            overflow: auto;
            align-content: start;
            min-height: 0;
        }

        .copy-row {
            display: grid;
            gap: 0.75rem;
            border: 1px solid rgba(22, 50, 79, 0.1);
            border-radius: 0.6rem;
            padding: 0.9rem;
            background: var(--white);
        }

        .copy-row.active {
            border-color: rgba(50, 184, 170, 0.72);
            box-shadow: 0 0 0 3px rgba(50, 184, 170, 0.12);
        }

        .copy-row-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .copy-row-key {
            min-width: 0;
            font-size: 0.82rem;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .copy-row-grid {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.25fr);
            gap: 0.75rem;
        }

        .label {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
        }

        .english-copy {
            min-height: 8.5rem;
            border: 1px solid var(--line);
            border-radius: 0.55rem;
            padding: 0.9rem;
            color: #2f4258;
            background: var(--white);
            font-size: 1rem;
            line-height: 1.65;
            overflow: auto;
        }

        textarea {
            width: 100%;
            min-height: 8.5rem;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 0.55rem;
            padding: 0.9rem;
            color: var(--ink);
            background: var(--white);
            font-family: "Noto Sans Khmer", Inter, sans-serif;
            font-size: 1.05rem;
            line-height: 1.75;
            outline: none;
        }

        .autosave-note {
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 1.45;
            margin-top: 0.55rem;
        }

        .editor-foot {
            padding: 0.9rem 1.1rem;
            border-top: 1px solid rgba(22, 50, 79, 0.1);
            background: #ffffff;
        }

        .review h2 {
            margin: 0 0 0.75rem;
            font-size: 0.95rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
            margin-bottom: 1rem;
        }

        .stat {
            border: 1px solid rgba(22, 50, 79, 0.1);
            border-radius: 0.55rem;
            padding: 0.7rem;
            background: var(--white);
        }

        .stat strong {
            display: block;
            font-size: 1.45rem;
            line-height: 1;
        }

        .stat span {
            display: block;
            margin-top: 0.25rem;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .issue-list {
            display: grid;
            gap: 0.45rem;
            margin-bottom: 1rem;
        }

        .issue {
            border-radius: 0.5rem;
            padding: 0.62rem 0.7rem;
            background: #fff7df;
            color: #624000;
            font-size: 0.8rem;
            line-height: 1.4;
            font-weight: 700;
        }

        .bulk-json {
            width: 100%;
            height: 8rem;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 0.55rem;
            padding: 0.75rem;
            outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .add-grid {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .add-input {
            width: 100%;
            height: 2.4rem;
            border: 1px solid var(--line);
            border-radius: 0.45rem;
            padding: 0 0.7rem;
            color: var(--ink);
            background: var(--white);
            outline: none;
        }

        .add-input:focus {
            border-color: rgba(50, 184, 170, 0.75);
            box-shadow: 0 0 0 3px rgba(50, 184, 170, 0.16);
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        @media (max-width: 1100px) {
            .workspace {
                grid-template-columns: minmax(15rem, 19rem) minmax(0, 1fr);
            }

            .review {
                grid-column: 1 / -1;
                border-left: 0;
                border-top: 1px solid rgba(22, 50, 79, 0.12);
            }

            .review .panel-inner {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem);
                gap: 1rem;
            }
        }

        @media (max-width: 760px) {
            .tool-header {
                align-items: stretch;
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1 1 9rem;
            }

            .workspace,
            .copy-row-grid,
            .review .panel-inner {
                grid-template-columns: 1fr;
            }

            .entry-list {
                height: 18rem;
            }

            .english-copy,
            textarea {
                min-height: 8rem;
            }
        }
    </style>
</head>
<body>
    <div class="tool-shell">
        <header class="tool-header">
            <div class="brand">
                <div class="brand-mark">KH</div>
                <div class="brand-text">
                    <strong>MedHub24 Khmer Copy Tool</strong>
                    <span id="sourceStatus">Loaded from locales/km/common.js</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" type="button" id="openSource">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7l2 3h7v13H4z"></path></svg>
                    <span>Connect Code</span>
                </button>
                <button class="btn mint" type="button" id="saveSource">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path></svg>
                    <span>Save To Code</span>
                </button>
                <a class="btn" href="index.html?lang=km">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
                    <span>Preview KH</span>
                </a>
            </div>
        </header>

        <main class="workspace">
            <aside class="sidebar">
                <div class="panel-inner">
                    <input class="search" id="searchInput" type="search" placeholder="Search key, English, Khmer" autocomplete="off">
                    <div class="filters" role="group" aria-label="Copy filters">
                        <button class="chip active" type="button" data-filter="all">All</button>
                        <button class="chip" type="button" data-filter="review">Review</button>
                        <button class="chip" type="button" data-filter="edited">Edited</button>
                    </div>
                    <div class="autosave-note" id="autoSaveNote">Preview sync is on. Code auto-save starts after Connect Code.</div>
                </div>
                <div class="entry-list" id="entryList"></div>
            </aside>

            <section class="editor" aria-label="Khmer copy editor">
                <div class="editor-head">
                    <div class="keyline">
                        <h1 class="mono" id="activeKey">meta.title</h1>
                        <div class="entry-meta" id="activeBadges"></div>
                    </div>
                    <div class="status" id="statusLine">Ready</div>
                </div>
                <div class="page-tabs" id="pageTabs" aria-label="Page content groups"></div>
                <div class="page-copy-list" id="pageCopyList"></div>
                <div class="editor-foot">
                    <div class="editor-actions">
                        <button class="btn mint" type="button" id="smartFix">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"></path><path d="m19 15 .9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9Z"></path></svg>
                            <span>Smart Fix</span>
                        </button>
                        <button class="btn" type="button" id="polishText">Polished</button>
                        <button class="btn" type="button" id="conciseText">Concise</button>
                        <button class="btn" type="button" id="copyPrompt">AI Prompt</button>
                        <button class="btn coral" type="button" id="revertText">Revert</button>
                    </div>
                </div>
            </section>

            <aside class="review">
                <div class="panel-inner">
                    <div>
                        <h2>Sync Status</h2>
                        <div class="stat-grid">
                            <div class="stat"><strong id="statTotal">0</strong><span>Total</span></div>
                            <div class="stat"><strong id="statReview">0</strong><span>Review</span></div>
                            <div class="stat"><strong id="statEdited">0</strong><span>Edited</span></div>
                            <div class="stat"><strong id="statMissing">0</strong><span>Missing</span></div>
                        </div>
                        <div class="issue-list" id="issueList"></div>
                    </div>
                    <div>
                        <h2>Bulk Update</h2>
                        <div class="add-grid">
                            <input class="add-input mono" id="newKeyInput" type="text" placeholder="new.key.name">
                            <button class="btn mint" type="button" id="addKey">Add Key</button>
                        </div>
                        <textarea class="bulk-json" id="bulkJson" spellcheck="false" placeholder='{"home.title":"..."}'></textarea>
                        <div class="bulk-actions" style="margin-top: 0.65rem;">
                            <button class="btn" type="button" id="applyJson">Apply JSON</button>
                            <button class="btn" type="button" id="fixAll">Fix All</button>
                            <button class="btn" type="button" id="copyCode">Copy Code</button>
                            <button class="btn" type="button" id="downloadCode">Download</button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script src="js/khmer-copy-tool.js"></script>
</body>
</html>
